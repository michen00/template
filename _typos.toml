[default]
extend-ignore-re       = ['(?Rm)^.*(#|/)\s*spellchecker:disable-line$']
# CPY is Ruff's copyright-notice rule prefix (.ruff.toml's `'CPY001'`), not a misspelling
# of "COPY"/"CPU". Verified against the pinned hook version (v1.50.1) via
# `pre-commit run --all-files`, not a locally installed typos binary -- an older local
# build does not flag CPY001 at all, which is how this got missed the first time.
extend-ignore-words-re = ['CPY']

[files]
# CHANGELOG.md is generated by git-cliff and embeds commit SHAs, whose hex
# fragments typos reads as misspelled words. .codespellrc already skips it.
extend-exclude = ['.gitignore', 'CHANGELOG.md', '*.lock']
