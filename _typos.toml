[default]
extend-ignore-re       = ['(?Rm)^.*(#|/)\s*spellchecker:disable-line$']

[files]
# CHANGELOG.md is generated by git-cliff and embeds commit SHAs, whose hex
# fragments typos reads as misspelled words. .codespellrc already skips it.
extend-exclude = ['.gitignore', 'CHANGELOG.md', '*.lock']
