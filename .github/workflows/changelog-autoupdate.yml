---
name: Changelog autoupdate
on:
  # schedule:
  #   - cron: '0 0 * * 1' # Run every Monday at 00:00
  workflow_dispatch:

permissions:
  contents: read

env:
  BRANCH_NAME: chore/changelog-autoupdate

jobs:
  # Builds the changelog under a read-only token, so the tools it installs never
  # run beside the write token that opening the pull request needs.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history needed for git cliff
          persist-credentials: false
      - name: Install git-cliff
        # Floating on purpose: install-action resolves an unversioned tool from
        # manifests baked into its own release, so pinning the action pins
        # git-cliff too. Let git-cliff track upstream.
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff
      - name: Update Unreleased section
        # git-cliff calls the GitHub API to map commit authors to handles. Without a
        # token that call 404s on a private repository and git-cliff exits instead of
        # degrading, so the job fails before writing anything. The default job token
        # is enough: the script only ever reads this repository's metadata.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/update-unreleased.sh
      - name: Format CHANGELOG.md
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint.yml
          globs: |
            CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog
          path: CHANGELOG.md

  pull-request:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
      - name: Push changes and create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: '${{ env.BRANCH_NAME }}'
          sign-commits: true
          title: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          body: |
            This PR updates the Unreleased section of CHANGELOG.md with recent commits.

            Generated by [git-cliff](https://git-cliff.org/).
          commit-message: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          delete-branch: true
          base: main
