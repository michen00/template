---
name: Bot auto-merge

# Approves eligible Dependabot and pre-commit-ci pull requests and arms squash
# auto-merge on them. Auto-merge waits for required checks, so nothing here polls them.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    # The author, not `github.actor`: a catch-up push makes its pusher the actor.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Auto-merge completes as whoever armed it, and a merge as `GITHUB_TOKEN` triggers
      # no workflows, hence the App. Dependabot's runs read only Dependabot secrets.
      - name: Detect App credentials
        id: creds
        env:
          APP_CLIENT_ID_VALUE: ${{ vars.APP_CLIENT_ID }}
          APP_KEY_VALUE: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APP_CLIENT_ID_VALUE" ] && [ -n "$APP_KEY_VALUE" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice::No App credential on this run; arming under the default" \
                 "token. The merge will fire no downstream push or closed event."
          fi

      - name: Mint an App token, if one is configured
        id: app-token
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # `continue-on-error` hides a failed mint.
      - name: Report a mint that failed
        if: >-
          steps.creds.outputs.available == 'true' &&
          (steps.app-token.outcome != 'success' || steps.app-token.outputs.token == '')
        run: |
          echo "::warning::App credentials are set but minting failed; falling back to" \
               "the default token. Auto-merge still works; downstream triggers will not."

      - name: Fetch Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Report metadata that cannot be gated on
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          !steps.meta.outputs.update-type
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "::notice::No update-type for ${ECOSYSTEM:-unknown}; leaving this for a human."

      # Never the head, so nothing from the pull request runs. The next step fetches the
      # head's commits as objects only.
      - name: Check out the default branch's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit was created by GitHub
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # An author login comes from an email anyone can set, so the head is trusted
          # only when GitHub created every commit, and:
          # - a non-merge commit is by the pull request's author;
          # - a merge is a clean merge of two parents or an admin's, since GitHub also
          #   signs a conflict resolved by hand;
          # - every commit that anyone but the author or an admin pushed, in any push
          #   since the branch was created, is a clean merge of two parents, since
          #   GitHub also signs whatever an App or `GITHUB_TOKEN` creates through its API.
          # Every check reads the one head commit that a trusted verdict names in `head`.
          # Fails closed: a failed query or fetch leaves `trusted` unset.
          set -euo pipefail
          head=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if ! [[ "$head" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "::error::could not read the PR's head commit; holding."
            exit 1
          fi
          if [ "$head" != "$EVENT_HEAD" ]; then
            echo "::warning::the head is no longer the one this event brought; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>"),
            .sha,
            ([.parents[].sha] | join(" "))
          ] | join("|")'
          # The commits endpoint stops at 250 without an error.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          # On a non-integer, `-gt` errors, and `if` reads that as false.
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read the PR's commit count; holding."
            exit 1
          fi
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          # These differ when a push lands between the reads.
          fetched=$(git rev-parse --verify 'refs/remotes/pr/head^{commit}')
          listed=$(printf '%s\n' "$rows" | awk -F'|' 'NF { sha = $4 } END { print sha }')
          if [ "$fetched" != "$head" ] || [ "$listed" != "$head" ]; then
            echo "::warning::the head moved while it was being inspected; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Succeeds for a commit with exactly two parents whose tree is their clean merge.
          mechanical() {
            local sha=$1 first second extra clean
            read -r first second extra <<< "$2"
            if [ -z "$second" ] || [ -n "$extra" ]; then
              return 1
            fi
            clean=$(git merge-tree --write-tree --no-messages "$first" "$second") || return 1
            [ "$clean" = "$(git rev-parse --verify "${sha}^{tree}")" ]
          }
          # Succeeds if the repository reports `admin` for the login, asked once per login.
          admins=' '
          others=' '
          admin() {
            local login=$1 permission
            if [ -z "$login" ] || [ "$login" = "<none>" ]; then
              return 1
            fi
            case $admins in *" $login "*) return 0 ;; esac
            case $others in *" $login "*) return 1 ;; esac
            permission=$(gh api "repos/${GH_REPO}/collaborators/${login}/permission" \
              --jq .permission) || permission=unknown
            if [ "$permission" = admin ]; then
              admins="${admins}${login} "
              return 0
            fi
            others="${others}${login} "
            return 1
          }
          rejected=0
          while IFS='|' read -r origin kind commit_author sha parents; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] && [ "$commit_author" != "$AUTHOR" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" = "merge" ] && ! mechanical "$sha" "$parents" &&
                 ! admin "$commit_author"; then
              echo "::warning::merge ${sha} by ${commit_author} is neither a clean merge" \
                   "of two parents nor an admin's; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          # A held push's commits stay in the branch, so the push that started this run
          # cannot vouch for the branch alone.
          for attempt in 1 2 3; do
            pushes=$(gh api -X GET "repos/${GH_REPO}/activity" -f ref="refs/heads/${HEAD_REF}" \
              -f direction=desc -F per_page=100 --paginate \
              --jq '.[] | [.activity_type, (.actor.login // "<none>"), .before, .after]
                | join("|")')
            newest=${pushes%%$'\n'*}
            [ "${newest##*|}" = "$head" ] && break
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          if [ "${newest##*|}" != "$head" ]; then
            echo "::warning::the branch's push history does not reach its head; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # `^HEAD` leaves out the default branch's commits, which a catch-up brings in
          # but did not write. Assigned, so a failed listing fails the step.
          in_branch=$(git rev-list "$head" '^HEAD')
          end=''
          expected=$head
          while IFS='|' read -r change pusher before after; do
            [ -z "$change" ] && continue
            if [ "$after" != "$expected" ]; then
              echo "::warning::the branch's push history skips a change; holding."
              rejected=$((rejected + 1))
              end=gap
              break
            fi
            expected=$before
            if [ "$pusher" != "$AUTHOR" ] && ! admin "$pusher"; then
              case $change in
                push | force_push) range=("$after" "^${before}") ;;
                branch_creation) range=("$after") ;;
                *) range=() ;;
              esac
              if [ "${#range[@]}" -eq 0 ]; then
                echo "::warning::${pusher} changed the branch by ${change}; holding."
                rejected=$((rejected + 1))
              else
                for commit in "${range[@]}"; do
                  commit=${commit#^}
                  if ! [[ "$commit" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
                    echo "::error::the push history names no commit; holding."
                    exit 1
                  fi
                  git cat-file -e "${commit}^{commit}" 2>/dev/null ||
                    git fetch -q --no-tags origin "$commit"
                done
                added=$(git rev-list --parents "${range[@]}" '^HEAD')
                while read -r sha parents; do
                  [ -z "$sha" ] && continue
                  grep -qxF "$sha" <<< "$in_branch" || continue
                  if ! mechanical "$sha" "$parents"; then
                    echo "::warning::${pusher} pushed ${sha}, which is not a clean merge" \
                         "of two parents; holding."
                    rejected=$((rejected + 1))
                  fi
                done <<< "$added"
              fi
            fi
            if [ "$change" = branch_creation ]; then
              end=creation
              break
            fi
          done <<< "$pushes"
          if [ -z "$end" ]; then
            echo "::warning::the branch's push history does not reach its creation;" \
                 "holding."
            rejected=$((rejected + 1))
          fi
          if [ "$rejected" -ne 0 ]; then
            echo "trusted=false" >>"$GITHUB_OUTPUT"
          else
            echo "trusted=true" >>"$GITHUB_OUTPUT"
            echo "head=${head}" >>"$GITHUB_OUTPUT"
          fi

      - name: Decide eligibility
        id: eligible
        if: steps.provenance.outputs.trusted == 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible."
            echo "should_merge=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "::notice::Dependabot ${UPDATE_TYPE}; eligible."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            version-update:semver-major)
              echo "::notice::${ECOSYSTEM:-unknown} major; eligible on green CI."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
              echo "should_merge=false" >>"$GITHUB_OUTPUT"
              ;;
          esac

      # A label applied during this run is not in the payload, and its disarm run may
      # have finished already.
      - name: Re-check the kill switch, then approve and arm
        if: steps.eligible.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARM_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERIFIED_HEAD: ${{ steps.provenance.outputs.head }}
        run: |
          # Assigned under `set -e`, so a failed query does not read as no label.
          set -euo pipefail
          if ! [[ "$VERIFIED_HEAD" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "::error::no verified head commit to approve; not arming."
            exit 1
          fi
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive, as GitHub compares label names.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            exit 0
          fi
          # Approves and arms in one step, since the disarm workflow leaves an approval in
          # place. The approval is github-actions', not the App's: a catch-up pushes as
          # the App, and a ruleset can discount the last pusher's approval. Both name the
          # verified head, so a later push leaves the approval stale and arming refused.
          decision=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)
          if [ "$decision" = "APPROVED" ]; then
            echo "::notice::Already approved."
          else
            gh api -X POST "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
              -f event=APPROVE -f commit_id="$VERIFIED_HEAD" >/dev/null ||
              echo "::warning::approval refused; auto-merge will wait for a reviewer."
          fi
          GH_TOKEN="$ARM_TOKEN" gh pr merge --auto --squash \
            --match-head-commit "$VERIFIED_HEAD" "$PR_NUMBER"

      # Turns off auto-merge, whoever armed it, when this run errored or did not trust the
      # head. A run for a label change or a reopen does so too, since it can cancel the run
      # for a push. A hold for eligibility leaves it: a person may have armed the update.
      - name: Disarm auto-merge unless this run vouched for the head
        if: always() && steps.provenance.outputs.trusted != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # Fails closed: anything short of a confirmed "off" disables again.
          for attempt in 1 2 3 4; do
            armed=$(gh pr view "$PR_NUMBER" --json autoMergeRequest \
              --jq '.autoMergeRequest != null') || armed=unknown
            if [ "$armed" = false ]; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::could not confirm auto-merge is off on a head no run vouched for."
              exit 1
            fi
            if gh pr merge --disable-auto "$PR_NUMBER"; then
              echo "::warning::auto-merge disarmed: this run did not vouch for the head."
            else
              sleep 5
            fi
          done
