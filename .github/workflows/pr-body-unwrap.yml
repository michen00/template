---
name: PR body unwrap

# unwrap-markdown-prose-py in .pre-commit-config.yaml already enforces this
# repository's one Markdown convention -- no manual line break inside a
# paragraph -- on every tracked file. A pull request body is not a tracked
# file, so that hook cannot reach it: an author who hard-wraps a draft in an
# editor or a shell heredoc publishes the ragged result to every reviewer
# with nothing here to catch it.
#
# Calls the published reusable workflow rather than reimplementing the
# transform: michen00/markdown-prose-hooks/.github/workflows/unwrap-pr-body.yml,
# documented under "On a pull request body" in that project's README. It
# rewrites, so it accepts only pull_request_target -- a pull_request run would
# read the workflow from the PR's own tree, and that file is what grants the
# token.
#
# Pinned to v0.5.0. v0.4.0 predates this reusable workflow entirely, so a
# `uses:` ref to it there cannot resolve; that fails the run before any job
# starts, and a run with no jobs contributes no check to the pull request it
# should have edited. Verified this ref actually resolves at v0.5.0 rather
# than assumed it from the tag being newest.
#
# opened, reopened, ready_for_review only, matching the reusable workflow's
# own guidance: running on every push would overwrite what the author had
# typed since. pr-body-unwrap-check.yml covers synchronize and edited
# instead, and this workflow deletes any report that check left once it
# rewrites the body, since GitHub raises no run for an event its own token
# caused.
#
# A bot-authored or empty body is skipped by the reusable workflow itself, so
# nothing here repeats that exemption.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  edit:
    permissions:
      pull-requests: write
    uses: michen00/markdown-prose-hooks/.github/workflows/unwrap-pr-body.yml@v0.5.0
