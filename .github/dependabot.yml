---
version: 2
# Version updates only: a security update still opens a pull request of its own.
multi-ecosystem-groups:
  deps:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
# Each entry takes its schedule and commit message from the group above.
updates:
  - package-ecosystem: uv
    directory: /
    patterns: ['*']
    multi-ecosystem-group: deps
    cooldown:
      default-days: 7
  # Dependabot owns hook bumps. pre-commit.ci is left as a slow backstop via
  # `autoupdate_schedule: quarterly` in .pre-commit-config.yaml -- its schedule
  # accepts only weekly/monthly/quarterly and cannot be stood down, so the two
  # cannot both be primary.
  - package-ecosystem: pre-commit
    directory: /
    patterns: ['*']
    multi-ecosystem-group: deps
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    patterns: ['*']
    multi-ecosystem-group: deps
    ignore:
      # changelog-autoupdate.yml floats this on the major on purpose:
      # install-action resolves an unversioned tool from manifests in its own
      # release, so pinning the action pins git-cliff with it.
      - dependency-name: taiki-e/install-action
    cooldown:
      # default-days only: GitHub rejects the semver-* keys for this ecosystem,
      # and an invalid key silently drops this whole entry.
      default-days: 7
