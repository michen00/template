---
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      uv-major:
        update-types: [major]
      uv-minor-patch:
        update-types: [minor, patch]
    cooldown:
      semver-major-days: 30
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
    ignore:
      # changelog-autoupdate.yml floats this on the major on purpose:
      # install-action resolves an unversioned tool from manifests baked into
      # its own release, so pinning the action pins git-cliff with it. Was
      # re-pinned to @v2.85.4 in #149 and had to be reverted.
      - dependency-name: taiki-e/install-action
    cooldown:
      # Wider than the uv ecosystem above, rather than at parity with it, and the
      # asymmetry is the point. This is the one ecosystem whose packages execute
      # with this repository's own token, inside jobs holding contents and
      # pull-requests write, so a compromised release can be published and
      # proposed here within hours. When the risk is the publisher rather than a
      # changed interface, a patch is not safer than a major, so the delay covers
      # every update and not only majors.
      #
      # The major figure also carries more weight than it did: bot-automerge.yml
      # now arms actions majors instead of holding them, because the actions here
      # are pinned to floating major tags, so Dependabot raises an actions pull
      # request only when a major moves -- which made a blanket hold permanent.
      # This delay is the soak period that replaced that hold. Without it four
      # majors landed the day after publication with no soak time.
      default-days: 7
      semver-major-days: 30
