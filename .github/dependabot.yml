---
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      uv-major:
        update-types: [major]
      uv-minor-patch:
        update-types: [minor, patch]
    cooldown:
      semver-major-days: 30
  # Dependabot owns hook bumps. pre-commit.ci is left as a slow backstop via
  # `autoupdate_schedule: quarterly` in .pre-commit-config.yaml -- its schedule
  # accepts only weekly/monthly/quarterly and cannot be stood down, so the two
  # cannot both be primary.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ['*']
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
    ignore:
      # changelog-autoupdate.yml floats this on the major on purpose:
      # install-action resolves an unversioned tool from manifests in its own
      # release, so pinning the action pins git-cliff with it.
      - dependency-name: taiki-e/install-action
    cooldown:
      # default-days only: GitHub rejects the semver-* keys for this ecosystem,
      # and an invalid key drops this whole entry without any local check
      # failing. The delay is long because bot-automerge.yml merges actions
      # majors with no other soak, and a compromised publisher ships a patch as
      # readily as a major.
      default-days: 30
