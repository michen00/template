[project]
name = 'template'
version = '0.0.0'
description = 'template'
readme = 'README.md'
authors = [{ name = 'Michael I Chen', email = 'michael.chen.0@gmail.com' }]
requires-python = '>=3.13'
dependencies = [
    'loguru>=0.7.3',
    'pandera[polars]>=0.32.1',
    'plotly>=6.9.0',
    'polars>=1.43.2',
    'pydantic-settings>=2.15.0',
    'pydantic>=2.13.4',
    'pyyaml>=6.0.2',
    'rich-argparse>=1.8.0',
    'typer>=0.27.1',
    'yapic-json>=1.9.5',
]

[project.scripts]
example-script = 'template.bin.example_script:run_script'

[dependency-groups]
dev = [
    'mypy>=2.3.0',
    'nox[uv]>=2026.8.10',
    'pip>=26.2.1',
    'pre-commit>=4.6.2',
    'prek>=0.4.13',
    'pylint>=4.0.7',
    'ruff>=0.16.2',
]
test = ['pytest>=9.1.1', 'pytest-cov>=6.2.1', 'pytest-xdist>=3.8.0']

[tool.uv]
default-groups = []
package        = true

[tool.mypy]
allow_redefinition       = true
disable_error_code       = ['import-untyped']
disallow_subclassing_any = false
enable_error_code        = ['ignore-without-code', 'redundant-expr', 'truthy-bool']
exclude                  = '.ipynb$'
local_partial_types      = true
mypy_path                = 'src'
plugins                  = ['pydantic.mypy']
pretty                   = true
show_column_numbers      = true
show_error_code_links    = true
strict                   = true
warn_return_any          = true
warn_unreachable         = true

[[tool.uv.index]]
name        = 'testpypi'
url         = 'https://test.pypi.org/simple/'
publish-url = 'https://test.pypi.org/legacy/'
explicit    = true

[tool.pytest.ini_options]
addopts = ['-ra', '--strict-config', '--strict-markers', '--cov']
filterwarnings = ['error', 'ignore::DeprecationWarning']
log_cli_level = 'INFO'
markers = [
    "no_ci: marks tests that should not run in CI (deselect with '-m \"not no_ci\"')",
]
minversion = '8.2'
testpaths = ['tests']
xfail_strict = true

[build-system]
requires      = ['uv_build>=0.12.4,<0.13.0']
build-backend = 'uv_build'
