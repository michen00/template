[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.5,<0.14" ]

[project]
name = "template"
version = "0.0.0"
description = "template"
readme = "README.md"
authors = [ { name = "Michael I Chen", email = "michael.chen.0@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "loguru>=0.7.3",
  "pandera[polars]>=0.35",
  "plotly>=7.1",
  "polars>=1.44.2",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "pyyaml>=6.0.2",
  "rich-argparse>=1.8",
  "typer>=0.27.3",
  "yapic-json>=1.9.5",
]
scripts.example-script = "template.bin.example_script:run_script"

[dependency-groups]
dev = [
  "mypy>=2.4",
  "nox[uv]>=2026.10.20",
  "pip>=26.2.2",
  "pre-commit>=4.7",
  "prek>=0.5.7",
  "pylint>=4.1.3",
  "ruff>=0.17.2",
]
test = [ "pytest>=9.1.1", "pytest-cov>=6.2.1", "pytest-xdist>=3.8" ]

[tool.uv]
default-groups = []
package = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pyproject-fmt]
# The newest Python CI runs; pyproject-fmt writes classifiers up to it.
max_supported_python = "3.13"

[tool.mypy]
mypy_path = "src"
exclude = ".ipynb$"
disallow_subclassing_any = false
warn_return_any = true
warn_unreachable = true
allow_redefinition = true
local_partial_types = true
disable_error_code = [ "import-untyped" ]
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true
show_column_numbers = true
show_error_code_links = true
pretty = true
plugins = [ "pydantic.mypy" ]

[tool.pytest]
ini_options.minversion = "8.2"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "-ra", "--strict-config", "--strict-markers", "--cov" ]
ini_options.markers = [
  "no_ci: marks tests that should not run in CI (deselect with '-m \"not no_ci\"')",
]
ini_options.xfail_strict = true
ini_options.filterwarnings = [ "error", "ignore::DeprecationWarning" ]
ini_options.log_level = "INFO"
