[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.6,<0.14" ]

[project]
name = "template"
version = "0.0.0"
description = "template"
readme = "README.md"
authors = [ { name = "Michael I Chen", email = "michael.chen.0@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "loguru>=0.7.3",
  "pandera[polars]>=0.35",
  "plotly>=7.1",
  "polars>=1.44.2",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "pyyaml>=6.0.2",
  "rich-argparse>=1.8",
  "typer>=0.27.3",
  "yapic-json>=1.9.5",
]
scripts.example-script = "template.bin.example_script:run_script"

[dependency-groups]
dev = [
  "basedpyright>=1.40.2",
  "nox[uv]>=2026.10.20",
  "pip>=26.2.2",
  "pre-commit>=4.7",
  "prek>=0.5.9",
  "pylint>=4.1.3",
  "ruff>=0.17.3",
  "types-pyyaml>=6.0.12.20261030",
]
test = [ "pytest>=9.2", "pytest-cov>=6.2.1", "pytest-xdist>=3.8" ]

[tool.uv]
default-groups = []
package = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pyproject-fmt]
# The newest Python CI tests.
max_supported_python = "3.13"
