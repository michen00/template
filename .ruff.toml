exclude = [
  '__pypackages__',
  '_build',
  '.bzr',
  '.direnv',
  '.eggs',
  '.git-rewrite',
  '.git',
  '.hg',
  '.ipynb_checkpoints',
  '.mypy_cache',
  '.nox',
  '.pants.d',
  '.pyenv',
  '.pytest_cache',
  '.pytype',
  '.ruff_cache',
  '.svn',
  '.tox',
  '.venv',
  '.vscode',
  '*.lock',
  'buck-out',
  'build',
  'dist',
  'node_modules',
  'site-packages',
  'venv',
]

line-length = 88
indent-width = 4
target-version = 'py313'

[lint]
select = ['ALL']
ignore = [
  'COM812',  # missing-trailing-comma
  'CPY001',  # missing-copyright-notice
  'ERA001',  # commented-out-code
  'PLR2004',  # magic-value-comparison
  'TD002',  # missing-todo-author
  'TD003',  # missing-todo-link
]

# The google convention turns D401 (imperative mood) off; the constitution wants it.
# DOC201 and DOC501 (Returns:, Raises:) are preview rules, and explicit-preview-rules
# keeps `select = ['ALL']` from pulling in the rest.
preview = true
explicit-preview-rules = true
extend-select = ['D401', 'DOC201', 'DOC501']
fixable = ['ALL']
unfixable = []
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[lint.flake8-quotes]
inline-quotes = 'single'

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
'__init__.py' = [
  'D104',  # undocumented-public-package
  'F401',  # unused-import
  'F403',  # undefined-local-with-import-star
]
'noxfile.py' = ['S603']  # subprocess-without-shell-equals-true
# Standalone CLIs that print their output and run a fixed `git log`.
'checks/*.py' = ['T201']  # Use of print
'checks/check_commit_messages.py' = [
  'S603',  # subprocess-without-shell-equals-true
  'S607',  # start-process-with-partial-path (`git` off PATH)
  'T201',  # Use of print
]
'tests/**/*.py' = [
  'D100',  # undocumented-public-module
  'S101',  # Use of assert
]
# The catch-up tests run workflow step bodies and the approval script under `bash`,
# against a stub `gh` put first on PATH, and pass stub tokens to the update loop.
'tests/test_{approve_bot_gated_runs,pr_catchup_workflow}.py' = [
  'S106',  # hardcoded-password-func-arg (stub tokens)
  'S603',  # subprocess-without-shell-equals-true
  'S607',  # start-process-with-partial-path (`bash` off PATH)
]
# A test docstring states what holds rather than commanding.
'tests/**/test_*.py' = ['D401']
'*/bin/*.py' = ['T201']  # Use of print
'*.ipynb' = [
  'F401',  # unused-import
  'S101',  # Use of assert
  'T201',  # Use of print
]

[lint.pydoclint]
ignore-one-line-docstrings = true

[lint.pydocstyle]
convention = 'google'

[lint.pylint]
max-branches = 15
max-returns = 10

[format]
quote-style = 'single'
indent-style = 'space'
skip-magic-trailing-comma = false
line-ending = 'auto'
docstring-code-format = true
docstring-code-line-length = 'dynamic'
