exclude = [
    '__pypackages__',
    '_build',
    '.bzr',
    '.direnv',
    '.eggs',
    '.git-rewrite',
    '.git',
    '.hg',
    '.ipynb_checkpoints',
    '.mypy_cache',
    '.nox',
    '.pants.d',
    '.pyenv',
    '.pytest_cache',
    '.pytype',
    '.ruff_cache',
    '.svn',
    '.tox',
    '.venv',
    '.vscode',
    '*.lock',
    'buck-out',
    'build',
    'dist',
    'node_modules',
    'site-packages',
    'venv',
] # Exclude a variety of commonly ignored directories.

# Same as Black.
line-length  = 88
indent-width = 4

target-version = 'py313'

[lint]
select = ['ALL']
ignore = [
    'COM812',  # missing-trailing-comma
    'CPY001',  # missing-copyright-notice
    'ERA001',  # commented-out-code
    'PLR2004', # magic-value-comparison
    'TD002',   # missing-todo-author
    'TD003',   # missing-todo-link
]

# `convention = 'google'` below disables D401, because Google style prescribes
# descriptive docstring first lines. The constitution asks for imperative mood,
# so re-enable it. D401 already exempts @property and "Whether ..." predicates.
# Test files (`tests/**/test_*.py`) are exempt in [lint.per-file-ignores] because the
# constitution requires test docstrings to be declarative truth-apt propositions rather
# than imperative; helper modules (conftest.py, _*.py) keep D401 enforcement.
extend-select = ['D401']

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable   = ['ALL']
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[lint.flake8-quotes]
inline-quotes = 'single'

[lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds `max-complexity`.
max-complexity = 15

[lint.per-file-ignores]
'__init__.py' = [
    'D104', # undocumented-public-package
    'F401', # unused-import
    'F403', # undefined-local-with-import-star
]
'noxfile.py' = ['S603'] # subprocess-without-shell-equals-true
# The PR checks are standalone CLIs: printing is their output, and the one
# subprocess call is a fixed `git log` argv with no user-supplied executable.
'checks/*.py' = ['T201'] # Use of print
'checks/check_commit_messages.py' = [
    'S603', # subprocess-without-shell-equals-true
    'S607', # start-process-with-partial-path (`git` off PATH)
    'T201', # Use of print
]
# Recursive, so a derived project's `tests/unit/` gets the same exemption; the old
# `tests/*.py` matched the top level only.
'tests/**/*.py' = ['S101'] # Use of assert
# D401 (imperative-mood) is re-enabled globally above; exempt it ONLY for `test_*.py`,
# where a docstring is a declarative truth-apt proposition per the constitution.
# Dedicated helper modules (conftest.py, _*.py) keep imperative-mood enforcement.
'tests/**/test_*.py' = ['D401']
'*/bin/*.py' = ['T201'] # Use of print
'*.ipynb' = [
    'F401', # unused-import
    'S101', # Use of assert
    'T201', # Use of print
]

[lint.pydocstyle]
convention = 'google'

[lint.pylint]
max-branches = 15
max-returns  = 10

[format]
# Unlike Black, use single quotes for strings.
quote-style = 'single'

# Like Black, indent with spaces, rather than tabs.
indent-style = 'space'

# Unlike Black, disregard magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = 'auto'

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = 'dynamic'
